[project]
name = "ringbridge-server"
version = "0.0.0"
description = "Ringbridge control plane: API, data model and durable workflows."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Annmary Vinod" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "livekit-api>=1.0",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "ringbridge-core",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.32",
]

[project.urls]
Homepage = "https://github.com/annmary-ann/ringbridge"
Issues = "https://github.com/annmary-ann/ringbridge/issues"

[tool.uv.sources]
ringbridge-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ringbridge_server"]
