# expect: spec.graph.nodes.greet: a node needs a 'goal' (conversation) or an 'action'
apiVersion: ringbridge.dev/v1alpha1
kind: Agent
metadata:
  name: minimal
spec:
  language:
    default: en-US
  voice:
    stt: { provider: deepgram }
    llm: { provider: openai, model: gpt-4.1-mini }
    tts: { provider: cartesia }
  persona: You are a helpful receptionist.
  disclosures:
    greeting: Hi, I'm an AI assistant and this call is recorded.
  business:
    timezone: America/New_York
  graph:
    start: greet
    nodes:
      greet:  # <- here
        tools: [call.end]
