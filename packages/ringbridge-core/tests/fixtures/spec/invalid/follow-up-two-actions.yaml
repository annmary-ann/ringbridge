# expect: a follow-up needs exactly one of 'send' or 'schedule_call'
apiVersion: ringbridge.dev/v1alpha1
kind: Agent
metadata:
  name: minimal
spec:
  language:
    default: en-US
  voice:
    stt: { provider: deepgram }
    llm: { provider: openai, model: gpt-4.1-mini }
    tts: { provider: cartesia }
  persona: You are a helpful receptionist.
  disclosures:
    greeting: Hi, I'm an AI assistant and this call is recorded.
  business:
    timezone: America/New_York
  graph:
    start: greet
    nodes:
      greet:
        goal: Help the caller.
        tools: [call.end]
  post_call:
    extract:
      outcome: { type: enum, values: [booked, other] }
    follow_ups:
      - when: outcome == 'booked'  # <- here
        send: { channel: sms, template: thanks }
        schedule_call: { after: 2h }
