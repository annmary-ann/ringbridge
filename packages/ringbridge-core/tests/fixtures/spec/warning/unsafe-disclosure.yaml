# expect: disclosure check is disabled
apiVersion: ringbridge.dev/v1alpha1
kind: Agent
metadata:
  name: minimal
spec:
  language:
    default: en-US
  voice:
    stt: { provider: deepgram }
    llm: { provider: openai, model: gpt-4.1-mini }
    tts: { provider: cartesia }
  persona: You are a helpful receptionist.
  disclosures:
    greeting: Hi there.
    unsafe_disable_disclosure: true  # <- here
  business:
    timezone: America/New_York
  graph:
    start: greet
    nodes:
      greet:
        goal: Help the caller.
        tools: [call.end]
