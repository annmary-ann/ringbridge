[project]
name = "ringbridge-core"
version = "0.0.0"
description = "AgentSpec models, domain types and connector protocols shared by every Ringbridge package."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Annmary Vinod" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
]

[project.urls]
Homepage = "https://github.com/annmary-ann/ringbridge"
Issues = "https://github.com/annmary-ann/ringbridge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ringbridge_core"]
