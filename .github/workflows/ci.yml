name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run poe lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run poe typecheck

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ringbridge
          POSTGRES_PASSWORD: ringbridge
          POSTGRES_DB: ringbridge
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U ringbridge" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      # Integration tests fail instead of skipping when Postgres is missing.
      RINGBRIDGE_REQUIRE_DB: "1"
      RINGBRIDGE_TEST_DATABASE_URL: postgresql://ringbridge:ringbridge@localhost:5435/ringbridge
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run poe test
      - name: Coverage summary
        if: always() && matrix.python == '3.12'
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  stack:
    name: Dev stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack with the SIP profile
        run: docker compose --profile sip up -d --wait --wait-timeout 180
      - name: Smoke test every service
        run: bash scripts/smoke-stack.sh --sip
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: LiveKit SIP sync against the real server
        env:
          RINGBRIDGE_REQUIRE_LIVEKIT: "1"
        run: uv run pytest -m livekit --no-cov packages/ringbridge-server
      - name: Logs on failure
        if: failure()
        run: docker compose --profile sip logs --tail 200
      - name: Stop
        if: always()
        run: docker compose --profile sip down -v

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits to scan only those
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit in the PR has Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha has no Signed-off-by line. Use 'git commit -s' (see CONTRIBUTING.md)."
              missing=1
            fi
          done
          exit $missing
