# Workspace root. The installable packages live in packages/*; this root is never built.
[project]
name = "ringbridge-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "ringbridge-core",
    "ringbridge-agent",
    "ringbridge-server",
    "ringbridge-connectors",
    "ringbridge-sim",
    "ringbridge-cli",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "poethepoet>=0.31",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ringbridge-core = { workspace = true }
ringbridge-agent = { workspace = true }
ringbridge-server = { workspace = true }
ringbridge-connectors = { workspace = true }
ringbridge-sim = { workspace = true }
ringbridge-cli = { workspace = true }

# ---------- tasks: `uv run poe <task>` ----------
[tool.poe.tasks]
lint = { sequence = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }], help = "Lint and format check" }
fmt = { sequence = [{ cmd = "ruff format ." }, { cmd = "ruff check --fix ." }], help = "Format and auto-fix" }
typecheck = { cmd = "python -m mypy", help = "Strict type check" }
typecheck-docker = { cmd = "docker run --rm -v ${POE_ROOT}:/src -w /src -e UV_PROJECT_ENVIRONMENT=/tmp/venv ghcr.io/astral-sh/uv:0.10.12-python3.12-trixie-slim uv run --locked python -m mypy", help = "mypy inside Linux, for machines where it can't run natively" }
test = { cmd = "python -m pytest", help = "Run all package tests with coverage" }
check = { sequence = ["lint", "typecheck", "test"], help = "Everything CI runs" }
hooks = { cmd = "pre-commit install", help = "Install git hooks" }

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "RET", "ARG"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["S101"]

# ---------- mypy ----------
[tool.mypy]
files = ["packages"]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = [
    "-q",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov=ringbridge_core",
    "--cov=ringbridge_agent",
    "--cov=ringbridge_server",
    "--cov=ringbridge_connectors",
    "--cov=ringbridge_sim",
    "--cov=ringbridge_cli",
    "--cov-report=term-missing",
]
markers = ["integration: needs the Docker Compose stack"]

[tool.coverage.report]
skip_covered = true
